# Ruff configuration for ggTrader
line-length = 100
target-version = "py311"

# research/ holds byte-frozen evidence (sha256 recorded in the reorg ledger) next to the study
# code that is linted (research/<category>/<study>/code and research/<category>/_lib). Only the
# frozen Python is excluded: the vectorbt-engine programme folder and the artifacts-* folders.
# Ruff's "*" also crosses "/", so tests/scripts/test_research_layout.py forbids an artifacts-
# segment below any code/ or _lib/ folder. The Claude ruff hook and .githooks/pre-commit pass
# explicit file paths, which ruff lints regardless of excludes unless force-exclude is on.
extend-exclude = ["research/programme/vectorbt-engine", "research/*/artifacts-*"]
force-exclude = true

[lint]
# Enable Pyflakes (F) and Pycodestyle (E, W) codes by default.
# TID251 is the import boundary: only src/ggTrader/engine/ may import vectorbt (spec 5.2).
select = ["E", "F", "W", "I", "TID251"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude common directories.
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".venv",
    "archive",
    "legacy_archive",
    "__pycache__",
]

[lint.flake8-tidy-imports.banned-api]
"vectorbt".msg = "Import vectorbt only inside src/ggTrader/engine/ (use ggTrader.engine presets)."
"vectorbt_rust".msg = "Import vectorbt_rust only inside src/ggTrader/engine/ (selfcheck)."

[lint.per-file-ignores]
# The adapter itself and the tests that hold it to raw vectorbt.
"src/ggTrader/engine/**" = ["TID251"]
"tests/engine/**" = ["TID251"]
# The one documented exception: scripts/legacy_reference_runs.py runs under the legacy 0.28.5
# interpreter against the tree extracted from git tag legacy-engine-vbt0285 and imports vectorbt
# by design. tests/engine/test_boundary.py fails if this entry has no violation left, and if it
# disagrees with ``LEGACY_ONLY``.
"scripts/legacy_reference_runs.py" = ["TID251"]  # legacy-interpreter-only reference runner
# Study code (research/<category>/<study>/code/) calls its bootstrap before the ggTrader imports so
# it runs from any checkout, which is what E402 (import not at top of file) flags.
"research/**/code/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
