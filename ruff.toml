# Ruff configuration for ggTrader
line-length = 100
target-version = "py311"

# research/ holds byte-frozen evidence (sha256 recorded in the reorg ledger) next to the study
# code that is linted (research/<category>/<study>/code and research/<category>/_lib). Only the
# frozen Python is excluded: the vectorbt-engine programme folder and the artifacts-* folders.
# Ruff's "*" also crosses "/", so tests/scripts/test_research_layout.py forbids an artifacts-
# segment below any code/ or _lib/ folder. The Claude ruff hook and .githooks/pre-commit pass
# explicit file paths, which ruff lints regardless of excludes unless force-exclude is on.
extend-exclude = ["research/programme/vectorbt-engine", "research/*/artifacts-*"]
force-exclude = true

[lint]
# Enable Pyflakes (F) and Pycodestyle (E, W) codes by default.
# TID251 is the import boundary: only src/ggTrader/engine/ may import vectorbt (spec 5.2).
select = [
    "E", "F", "W", "I", "TID251", "UP006", "UP035", "UP045", "B", "S110",
    "C901", "PLR0912", "PLR0915", "PLR0913", "DTZ", "G004", "ARG001", "ARG002",
    "ANN001", "ANN201", "T201",
]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Exclude common directories.
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".venv",
    "archive",
    "legacy_archive",
    "__pycache__",
]

# Complexity limits (design 5.4): complexity 15 and 8 arguments; the branch (12) and statement (50)
# limits stay at ruff's defaults. The four rules apply to all of src/ggTrader (refactor phase 6);
# every remaining finding is a listed survivor in per-file-ignores below, so a new offender fails.
# scripts, tests and research are outside them (the "!src/ggTrader/**" glob below).
[lint.mccabe]
max-complexity = 15

[lint.pylint]
max-args = 8

[lint.flake8-tidy-imports.banned-api]
"vectorbt".msg = "Import vectorbt only inside src/ggTrader/engine/ (use ggTrader.engine presets)."
"vectorbt_rust".msg = "Import vectorbt_rust only inside src/ggTrader/engine/ (selfcheck)."

[lint.per-file-ignores]
# The adapter itself and the tests that hold it to raw vectorbt.
"src/ggTrader/engine/**" = ["TID251"]
"tests/engine/**" = ["TID251"]
# The one documented exception: scripts/legacy_reference_runs.py runs under the legacy 0.28.5
# interpreter against the tree extracted from git tag legacy-engine-vbt0285 and imports vectorbt
# by design. tests/engine/test_boundary.py fails if this entry has no violation left, and if it
# disagrees with ``LEGACY_ONLY``.
"scripts/legacy_reference_runs.py" = ["TID251", "UP006", "UP035", "UP045", "B", "S110"]
# Frozen evidence, tests, and standalone legacy tooling are outside this lint migration.
"research/**" = ["UP006", "UP035", "UP045", "B", "S110"]
"tests/**" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/p5_wfo_validation.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/p7_live_golden.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/legacy_reference_compare.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/verify_pins.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/verdict_register.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/study.py" = ["UP006", "UP035", "UP045", "B", "S110"]
"scripts/vbt_latest.py" = ["UP006", "UP035", "UP045", "B", "S110"]
# Rules enabled for src/ggTrader only (refactor phase 6); scripts, tests and research are outside
# them. Each rule is added to the select list and to this one negated glob together.
"!src/ggTrader/**" = [
    "C901", "PLR0912", "PLR0915", "PLR0913", "DTZ", "G004", "ARG001", "ARG002", "ANN001", "ANN201",
    "T201",
]
# ARG001/ARG002 survivors (`ruff check --select ARG001,ARG002 src/ggTrader`: 11 findings, 2 fixed by
# dropping the unused parameter of the two membership check handlers; 9 listed here). An unused
# argument is kept where a base class, a protocol or a keyword caller fixes the signature.
# YFinanceDataLoader.fetch_ohlcv: `limit` is the BaseDataLoader signature; yfinance uses start/end.
"src/ggTrader/data/live/yfinance_loader.py" = ["ARG002"]
# _Rows.handle_starttag overrides HTMLParser and must accept `attrs`.
"src/ggTrader/data/membership_press.py" = ["ARG002"]
# run_wfo(market=...) is a label no body uses, but the frozen oracle drivers, blend.py and the tests
# pass it by keyword, so the parameter stays. Its prints are the ``ggt lab`` terminal output (T201
# below).
"src/ggTrader/lab/wfo/run.py" = ["ARG001", "T201", "PLR0912", "PLR0913", "PLR0915"]
# DryRunExecution implements the Execution protocol: its no-op submit, after_orders and
# unfilled_exit_errors keep the protocol's parameters (intent, orders, filled, broker_positions).
"src/ggTrader/paper/execution.py" = ["ARG002"]
# The read-only ledger's skip(*args, **kwargs) stands in for any write method of the wrapped ledger.
"src/ggTrader/paper/ledger.py" = ["ARG001"]
# T201 (print): 170 findings in 10 files. Two prints in the timescaledb loader became log calls.
# The rest is the terminal output of a ggt command, kept as print because the run configures no
# logging reaches only stderr (the ggt CLI installs a stderr handler at INFO), and tests pin the text on stdout.
# The ggt command modules print their own results and errors.
"src/ggTrader/cli/**" = ["T201"]
# fetch_chain's "  [data] ..." progress lines (tests/lab/test_fetch_stock_ohlcv_chain.py pins them).
"src/ggTrader/data/live/fetch_chain.py" = ["T201"]
# The ``ggt lab`` run: blend result, the WFO banner, per-fold progress (run.py, listed with its
# ARG001 entry above), the fold table, the result path.
"src/ggTrader/lab/cli.py" = ["T201"]
"src/ggTrader/lab/wfo/cli_support.py" = ["T201", "PLR0913"]
# selfcheck is a build-time command: JSON on stdout, the failure on stderr, exit code 1.
"src/ggTrader/engine/selfcheck.py" = ["T201"]
# create_db_engine_or_exit tells the person at the terminal why it exits with status 1.
"src/ggTrader/utils/db_engine.py" = ["T201"]
# Survivors of the refactor phase 5 inventory (`ruff check --select C901,PLR0912,PLR0915,PLR0913
# src/ggTrader/paper`: 18 findings at 10 definitions in 8 files), one entry per file and only the
# rules that file still trips. A survivor is not a defect: the order of these steps is behavior,
# so a body moved out of PaperTrader._run keeps its shape rather than being split further.
# Moved body of the split-correction method (was PaperTrader._compute_split_corrections).
"src/ggTrader/paper/corporate_actions.py" = ["C901", "PLR0912"]
# Telegram daily-summary builder, untouched by the refactor; its 11 arguments are the message.
"src/ggTrader/paper/notifier.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
# Stage I of the order flow (stops, exit validation, buy limits), moved from _run (region R6a).
"src/ggTrader/paper/order_flow.py" = ["PLR0912"]
# Pure planners take their inputs as keyword-only arguments (plan_sweep_sell, BuyPlanner, plan_buys).
"src/ggTrader/paper/planning.py" = ["PLR0913"]
# Notifier.daily_summary mirrors the notifier's 11-argument signature.
"src/ggTrader/paper/ports.py" = ["PLR0913"]
# PreflightGate.check: the market, signal, late-run and freshness gates, moved from _run (R2).
"src/ggTrader/paper/preflight.py" = ["C901", "PLR0912", "PLR0915"]
# RunReporter.finish: alerts, corrected value, summary and snapshot, moved from _run (R5, R7).
"src/ggTrader/paper/reporter.py" = ["PLR0915"]
# RiskAssessor.assess: peak seed, drawdown and daily-loss halts, moved from _run (R4).
"src/ggTrader/paper/risk_assessor.py" = ["C901", "PLR0912", "PLR0915"]
# Survivors of the refactor phase 6 sweep outside paper/ (`ruff check --select C901,PLR0912,PLR0915,
# PLR0913 src/ggTrader`: 42 findings at 29 definitions in 18 files; none split, because the only
# allowed split is a pure helper under an existing test and the bodies below are ordered pipelines,
# frozen oracle code or keyword APIs that studies and tests call by name). One entry per file, only
# the rules that file still trips. A survivor is a known shape, not a defect; the rules now block
# new offenders. lab/wfo/run.py and lab/wfo/cli_support.py are listed with their entries above
# (run_wfo, _make_scorer, _score_fold; run_vbt_wfo takes the ``ggt lab --wfo`` options).
# load_bars is the research data API: 3 positional and 7 keyword-only options, called by name.
"src/ggTrader/data/bars.py" = ["PLR0913"]
# fetch_ohlcv: the DB-first, gap-fill, split-and-dividend sequence; not a pure function (it reads and writes the database cache), so the brief's split rule excludes it.
"src/ggTrader/data/live/cached_yfinance_loader.py" = ["C901", "PLR0912", "PLR0915"]
# parse_events_csv validates a curated CSV row by row; plan_events turns events into a plan in
# date order; prepare_events_load carries the 13 inputs of one vintage write.
"src/ggTrader/data/membership_events.py" = ["C901", "PLR0912", "PLR0913"]
# parse_holdings reads the fund-holdings file layout in one pass (header, as-of date, rows, duplicate and count checks).
"src/ggTrader/data/membership_holdings.py" = ["C901", "PLR0912"]
# build_proposal takes each proposal input as a keyword-only argument.
"src/ggTrader/data/membership_proposal.py" = ["PLR0913"]
# split_cells and parse_ledger walk wikitext and fail closed on any unexpected shape; the
# branches are the grammar.
"src/ggTrader/data/membership_sources.py" = ["PLR0912", "PLR0915"]
# _write_vintage carries one vintage's columns; reinstate_vintage is the ordered reinstate steps.
"src/ggTrader/data/universe_db.py" = ["PLR0913", "PLR0915"]
# run_signals takes the 16 options of one grouped vectorbt call; _validate_intraday_stops checks each
# stop input in turn. Phase 3 settled this file; it is not reshaped here.
"src/ggTrader/engine/portfolio.py" = ["PLR0912", "PLR0913"]
# compare checks each provenance field in turn; one branch per field.
"src/ggTrader/engine/provenance.py" = ["PLR0912"]
# check_rebalance applies the 70/30 band rule lot by lot with its tax-lot cases; called by scripts/a23_rebalance_check.py, tests and a study-library parity test.
"src/ggTrader/lab/a23_rebalance.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
# run_blend takes the ``ggt lab --blend`` options by keyword.
"src/ggTrader/lab/blend.py" = ["PLR0913"]
# simulate_signal_out is the engine contract's simulate call; callers pass its options by name.
"src/ggTrader/lab/strategies/contract.py" = ["PLR0913"]
# format_wfo_table takes the results and the metrics it prints.
"src/ggTrader/lab/wfo/report.py" = ["PLR0913"]
# The fold scorers (oracle-pinned): window metrics inputs, two constructors that take the
# simulation inputs, and the one grouped simulate step.
"src/ggTrader/lab/wfo/scorers.py" = ["PLR0913", "PLR0915"]
# Study code (research/<category>/<study>/code/) calls its bootstrap before the ggTrader imports so
# it runs from any checkout, which is what E402 (import not at top of file) flags.
"research/**/code/*.py" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
# ruff 0.16 began formatting fenced code blocks inside Markdown files. The docs and the byte-frozen
# research reports (hashed in the reorg ledger) must not be rewritten by a formatter, so only
# Python is formatted.
exclude = ["*.md"]
