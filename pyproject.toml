[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggTrader"
version = "0.1.0"
description = "A sleek algorithmic trading bot"
requires-python = ">=3.11"
dependencies = [
    "ccxt",
    "defusedxml",
    "fsspec",
    "joblib",
    "matplotlib",
    "mplfinance",
    "numba",
    "numpy",
    "optuna",
    "pandas",
    "pandas-ta",
    "plotly",
    "psycopg2-binary",
    "pyarrow",
    "pypdf",
    "python-dotenv",
    "pytrends",
    "requests",
    "scikit-learn",
    "seaborn",
    "sqlalchemy",
    "ta",
    "tabulate",
    "tqdm",
    "vectorbt",
    "xlsxwriter",
    "yfinance",
    "alpaca-py",
    "pydantic>=2.0",
    "typer>=0.12",
    "typing-extensions",
    "hmmlearn",
    "lightgbm",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
test = ["pytest"]
dev = ["black", "mypy>=1.8"]

[project.scripts]
ggt = "ggTrader.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggTrader*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '/(\.git|\.venv|archive)/'

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
pythonpath = ["."]
markers = [
    "integration: tests that hit live external services (network, DB); run with -m integration",
]

[tool.mypy]
python_version = "3.11"
strict = false


