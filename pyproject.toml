[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggTrader"
version = "0.1.0"
description = "A sleek algorithmic trading bot"
requires-python = ">=3.8"
dependencies = [
    "ccxt",
    "fsspec",
    "joblib",
    "matplotlib",
    "mplfinance",
    "numba",
    "numpy",
    "optuna",
    "pandas",
    "pandas-ta",
    "plotly",
    "psycopg2-binary",
    "pyarrow",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "seaborn",
    "sqlalchemy",
    "ta",
    "tabulate",
    "tqdm",
    "vectorbt",
    "xlsxwriter",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
test = ["pytest"]
dev = ["black"]

[project.scripts]
ggtrader-backtest = "ggTrader.cli.entrypoints:backtest"
ggtrader-wfo = "ggTrader.cli.entrypoints:wfo"
ggtrader-sensitivity = "ggTrader.cli.entrypoints:sensitivity"
ggtrader-pipeline = "ggTrader.cli.entrypoints:pipeline"
ggtrader-compare-strategies = "ggTrader.cli.entrypoints:compare_strategies"
ggtrader-view-results = "ggTrader.cli.entrypoints:view_results"
ggtrader-pipeline-status = "ggTrader.cli.entrypoints:pipeline_status"
ggtrader-manage-data = "ggTrader.cli.entrypoints:manage_data"
ggtrader-manage-db = "ggTrader.cli.entrypoints:manage_db"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggTrader*"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '/(\.git|\.venv|archive)/'
