[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggTrader"
version = "0.1.0"
description = "A sleek algorithmic trading bot"
requires-python = ">=3.8"
dependencies = [
    "ccxt",
    "fsspec",
    "joblib",
    "matplotlib",
    "mplfinance",
    "numba",
    "numpy",
    "optuna",
    "pandas",
    "pandas-ta",
    "plotly",
    "psycopg2-binary",
    "pyarrow",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "seaborn",
    "sqlalchemy",
    "ta",
    "tabulate",
    "tqdm",
    "vectorbt",
    "xlsxwriter",
    "yfinance",
    "alpaca-py",
    "pydantic>=2.0",
    "typer>=0.12",
    "typing-extensions",
    "hmmlearn",
    "lightgbm",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
test = ["pytest"]
dev = ["black", "mypy>=1.8"]

[project.scripts]
ggt = "ggTrader.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggTrader*"]

[tool.black]
line-length = 100
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '/(\.git|\.venv|archive)/'

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit live external services (network, DB); deselect with -m 'not integration'",
]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = [
    "ggTrader.core.instrument",
    "ggTrader.core.signal",
    "ggTrader.core.order",
    "ggTrader.core.calendar",
    "ggTrader.core.universe",
    "ggTrader.core.types",
    "ggTrader.core.ticker",
    "ggTrader.core.balance",
    "ggTrader.execution.base",
    "ggTrader.execution.errors",
    "ggTrader.execution.kraken_spot",
    "ggTrader.execution.kraken_futures",
    "ggTrader.strategies.base",
    "ggTrader.strategies.loader",
    "ggTrader.strategies.carry.cash_and_carry",
    "ggTrader.core.calendars",
    "ggTrader.features.base",
    "ggTrader.features.derivatives_synthetic",
    "ggTrader.backtest.vectorized",
]
strict = true
