[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ggTrader"
version = "0.1.0"
description = "A sleek algorithmic trading bot"
requires-python = "==3.12.*"
# Intent lives here, the resolved truth lives in uv.lock (install with
# `uv sync --frozen`). Engine stack bounds mirror vectorbt 1.2.0's own floors.
dependencies = [
    # Engine stack: `vectorbt[rust]==X` pulls the matching vectorbt-rust==X. The pair is
    # atomic; bump it by editing this one line and re-locking. vectorbt-rust is also listed
    # explicitly so a lock that drops the extra fails loudly.
    "vectorbt[rust]==1.2.0",
    "vectorbt-rust==1.2.0",
    "numpy>=2.4.6,<2.6",
    "pandas>=3.0.3,<3.2",
    "numba>=0.66,<0.69",
    "plotly>=7,<8",
    "alpaca-py",
    "beautifulsoup4",  # lab/event_timing_sources.py
    "ccxt",
    "defusedxml",
    "joblib",
    "lightgbm",
    "matplotlib",
    "pandas-market-calendars",
    "psycopg2-binary",
    # Kept: pandas 3's default `str` dtype is Arrow-backed only when pyarrow is installed.
    "pyarrow",
    "pydantic>=2.0",
    "pypdf",
    "python-dotenv",
    "pytrends",
    "requests",
    "scikit-learn",
    "scipy",  # lab/gates.py, lab/momentum_screen.py, lab/event_study.py
    "sqlalchemy",
    # Newey-West HAC t statistic for the intraday r8 study's A1 gate.
    "statsmodels",
    "tqdm",
    "typer>=0.12",
    "typing-extensions",
    # Reads Shiller's legacy .xls dividend workbook (century leverage study).
    "xlrd>=2.0.1",
    "yfinance",
]

[project.optional-dependencies]
gpu = ["cupy-cuda13x"]
test = ["pytest"]
# ruff is PINNED exactly: `ruff format` output changes between minor
# versions, so an unpinned CI would fail the format check against code a
# developer just formatted locally. Bump deliberately, reformatting in the
# same commit.
dev = ["ruff==0.15.12", "mypy>=1.8"]

[project.scripts]
ggt = "ggTrader.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ggTrader*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
pythonpath = ["."]
# A bare `pytest` must not collect research/: it holds study scripts named test_*.py that are
# not part of the suite (P8 R13), and the vbt-upgrade-watch and CI jobs run a bare pytest.
testpaths = ["tests"]
markers = [
    "integration: tests that hit live external services (network, DB); run with -m integration",
    "slow: a single test of 3 s or more, or an end-to-end test on the frozen real tape; FULL tier only",
    "numba: runs the numba engine (JIT compile cost); the default engine is rust; FULL tier only",
    "tripwire: only meaningful when a dependency pin moves; FULL tier only",
    "study: tests the code of one closed research study, not the engine; STUDIES and FULL tiers",
    "tooling: tests a repository-maintenance script or its workflow; FULL tier only",
]

[tool.mypy]
python_version = "3.12"
strict = false
