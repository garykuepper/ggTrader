# Dependabot handles everything EXCEPT the engine stack. The vectorbt / vectorbt-rust pair
# (and the libraries whose bounds it sets) is owned by .github/workflows/vbt-upgrade-watch.yml
# and the vbt-upgrade skill, so the pair is never bumped one half at a time.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Engine stack: keep in step with ENGINE_STACK in tests/engine/test_lock_consistency.py
      - dependency-name: "vectorbt"
      - dependency-name: "vectorbt-rust"
      - dependency-name: "pandas"
      - dependency-name: "numpy"
      - dependency-name: "numba"
      - dependency-name: "llvmlite"
      - dependency-name: "plotly"
      # Pinned exactly in pyproject.toml on purpose: `ruff format` output changes between
      # versions (0.16 started formatting Markdown code blocks). Bump by hand, with the reformat.
      - dependency-name: "ruff"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      # upload and download must move together (same artifact backend): one PR, never two.
      artifact-actions:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
    ignore:
      # Upstream removed the GitHub Action in opencode v2.2.0 (#59032); v2.x has no github/action.yml.
      # The pinned v1 still works for the dormant .github/workflows/opencode.yml.
      - dependency-name: "anomalyco/opencode/github"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # requires-python is ==3.12.*; a 3.13/3.14 base image would break the lock. Digest and
      # patch refreshes of python:3.12-slim still come through.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
