name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Both sha forms are immutable: the 7-character short sha (what GGTRADER_TAG
          # usually holds) and the full 40-character sha. `latest` moves, so the trader never
          # trusts it (spec 8.3). A branch build via workflow_dispatch gets only the sha tags.
          tags: |
            type=sha,prefix=
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build once into the local image store and smoke-test it BEFORE anything is pushed:
      # the Rust engine must dispatch, the trader must import, the CLI must load. The
      # Dockerfile runs the same checks at build time; running the finished image proves the
      # artifact that would be pushed.
      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ggtrader-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm ggtrader-smoke:ci python -m ggTrader.engine.selfcheck --engine rust
          docker run --rm ggtrader-smoke:ci python scripts/check_vbt_engine.py --engine rust
          docker run --rm ggtrader-smoke:ci python -c "import ggTrader.paper.trader"
          docker run --rm ggtrader-smoke:ci python -u ggt.py paper --help

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
