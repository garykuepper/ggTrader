name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes an in-flight run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match requires-python in pyproject.toml.
          python-version: '3.12'
          cache: pip

      - name: Install
        # dev carries ruff; test carries pytest.
        run: pip install -e ".[test,dev]"

      - name: Lint
        # ruff.toml is the source of truth for rules and line length. The same
        # checks run locally on every edit via .claude/hooks/ruff-fix.sh, so a
        # failure here usually means someone bypassed the hook.
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # Integration tests are deselected by the `-m 'not integration'` default
        # in pyproject.toml -- they need a live TimescaleDB and network access,
        # neither of which exists on the runner.
        run: pytest -q
