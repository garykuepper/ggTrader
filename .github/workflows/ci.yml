name: CI

# Two tiers (tests/tiers.py is the one place that says which tests are in which):
#   test  FAST CORE: lint + engine check + the developer-loop tests (about two minutes). Runs on
#         every pull request and on every push to main. Its job id stays `test`, so a branch
#         protection rule that requires the check named "test" keeps working.
#   studies  The study tier: the pins of the frozen research evidence still resolve to real code
#         (scripts/verify_pins.py, which needs the full git history), then the tests of closed
#         research studies (`scripts/run_tests.sh --studies`: `--tier studies tests`, then the
#         explicit research/*/*/code/tests and research/*/_lib/tests folders under
#         `--min-collected`; never the bare research folder). Runs on every pull request, push to
#         main, weekly and by hand, with no path filter: a path-filtered required check never
#         reports on an unrelated pull request and stays pending, so a change under src/ cannot
#         break a study's code unseen.
#   full  EVERYTHING except `integration`: the merge, deploy and vectorbt-upgrade gate. Runs on
#         every push to main and weekly, because the fast core leaves out the slow, numba,
#         tripwire, study and tooling tests. The real-tape oracles and the live golden still skip
#         here (the tape is git-ignored): run `scripts/run_tests.sh --full` locally before a merge.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 07:15 UTC: catches dependency or runner drift between pushes.
    - cron: "15 7 * * 1"
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes an in-flight run; the weekly run has its own group.
  group: ci-${{ github.event_name == 'schedule' && 'weekly' || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # The weekly schedule runs the full job only.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Same uv that wrote uv.lock.
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Must match requires-python in pyproject.toml.
          python-version: '3.12'

      - name: Install
        # Install exactly what uv.lock says, so CI tests what ships. dev carries ruff;
        # test carries pytest. --frozen fails instead of re-resolving a stale lock.
        run: |
          uv sync --frozen --extra test --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Engine check
        # The simulator must dispatch to the Rust engine, not silently fall back to numba.
        run: |
          uv lock --check
          uv pip check
          python scripts/check_vbt_engine.py --engine rust

      - name: Lint
        # ruff.toml is the source of truth for rules and line length. The same
        # checks run locally on every edit via .claude/hooks/ruff-fix.sh, so a
        # failure here usually means someone bypassed the hook.
        run: |
          ruff check .
          ruff format --check .

      - name: Test (fast core)
        # Integration tests are deselected by the `-m 'not integration'` default
        # in pyproject.toml -- they need a live TimescaleDB and network access,
        # neither of which exists on the runner. `--tier fast` also leaves out the
        # slow, numba, tripwire, study and tooling tests (tests/tiers.py); the `full`
        # job runs them.
        run: pytest tests -q --tier fast

  studies:
    name: studies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # verify_pins walks the history of moved and edited files; a shallow clone is refused.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Same uv that wrote uv.lock.
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Must match requires-python in pyproject.toml.
          python-version: '3.12'

      - name: Install
        run: |
          uv sync --frozen --extra test --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Evidence pins
        # 22 code hashes recorded in frozen research reports must keep resolving: at their path
        # (MATCH), at the new path research/CODEMOVED.csv names (MOVED-MATCH), or in history
        # (HISTORY-MATCH). Each slice that moves pinned code updates these counts in this line.
        run: python scripts/verify_pins.py --expect MATCH=15,MOVED-MATCH=0,HISTORY-MATCH=7,FAIL=0

      - name: Test (study tier)
        # run_tests.sh builds the explicit path list; GGT_TEST_NO_CGROUP skips the developer
        # host's systemd memory cap, which a runner does not have.
        run: GGT_TEST_NO_CGROUP=1 scripts/run_tests.sh --studies -q

  full:
    name: full
    # Every push to main, the weekly schedule and a manual run; pull requests run the fast core.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # Same uv that wrote uv.lock.
          version: "0.11.25"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Must match requires-python in pyproject.toml.
          python-version: '3.12'

      - name: Install
        run: |
          uv sync --frozen --extra test --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Engine check
        run: |
          uv lock --check
          uv pip check
          python scripts/check_vbt_engine.py --engine rust

      - name: Test (full suite)
        # The pyproject default: everything except `integration`. Reports skips (-rs) so a
        # run that skipped the tape-dependent oracles says so.
        run: pytest tests -q -rs
