strategy_id: funding_carry_btc_real
strategy_class: ggTrader.strategies.carry.funding_carry:FundingCarryBTC

# Long leg: spot BTC on Kraken Spot
spot:
  symbol: BTC-USD
  asset_class: crypto_spot
  venue: kraken_spot
  base_currency: BTC
  quote_currency: USD
  tick_size: "0.01"
  min_order_size: "0.0001"
  maker_fee_bps: "16"
  taker_fee_bps: "26"
  calendar_id: crypto_24_7

# Short leg: linear perpetual on Kraken Futures
perp:
  symbol: BTC-USD-PERP
  asset_class: crypto_perp
  venue: kraken_futures
  base_currency: BTC
  quote_currency: USD
  tick_size: "1"
  min_order_size: "0.0001"
  maker_fee_bps: "2"
  taker_fee_bps: "5"
  calendar_id: crypto_24_7
  venue_specific_id: PF_XBTUSD

# Signal: realized funding APR (30-day rolling avg).
# Hysteresis: enter when smoothed funding > 8%; exit when < 4%.
# Also force-exit on 8h of consecutive negative funding (1/3 day).
signal_source: funding
entry_threshold_apr: "0.08"
exit_threshold_apr: "0.04"
notional_usd: "10000"
negative_funding_exit_consecutive: 8

# Backtest defaults — match the API-permitted real-funding window
backtest:
  start: "2025-05-15"
  end:   "2026-05-15"
