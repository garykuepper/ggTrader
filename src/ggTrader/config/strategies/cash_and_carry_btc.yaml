strategy_id: cash_and_carry_btc
strategy_class: ggTrader.strategies.carry.cash_and_carry:CashAndCarryBTC

# Long leg: spot BTC on Kraken Spot
spot:
  symbol: BTC-USD
  asset_class: crypto_spot
  venue: kraken_spot
  base_currency: BTC
  quote_currency: USD
  tick_size: "0.01"
  min_order_size: "0.0001"
  maker_fee_bps: "16"
  taker_fee_bps: "26"
  calendar_id: crypto_24_7

# Short leg: dated quarterly futures on Kraken Futures.
# ``expiry`` is ISO date; ``venue_specific_id`` is the ccxt symbol Kraken expects.
# The strategy rolls 24h before expiry into the next contract in this list.
futures:
  # Backtest expiry ladder spanning 2022–2027 so the synthetic backtest exercises
  # the roll logic. Real-data backtests will pull this list from TimescaleDB.
  - { symbol: BTC-USD-220325, expiry: "2022-03-25", venue_specific_id: "BTC/USD:USD-220325" }
  - { symbol: BTC-USD-220624, expiry: "2022-06-24", venue_specific_id: "BTC/USD:USD-220624" }
  - { symbol: BTC-USD-220930, expiry: "2022-09-30", venue_specific_id: "BTC/USD:USD-220930" }
  - { symbol: BTC-USD-221230, expiry: "2022-12-30", venue_specific_id: "BTC/USD:USD-221230" }
  - { symbol: BTC-USD-230331, expiry: "2023-03-31", venue_specific_id: "BTC/USD:USD-230331" }
  - { symbol: BTC-USD-230630, expiry: "2023-06-30", venue_specific_id: "BTC/USD:USD-230630" }
  - { symbol: BTC-USD-230929, expiry: "2023-09-29", venue_specific_id: "BTC/USD:USD-230929" }
  - { symbol: BTC-USD-231229, expiry: "2023-12-29", venue_specific_id: "BTC/USD:USD-231229" }
  - { symbol: BTC-USD-240329, expiry: "2024-03-29", venue_specific_id: "BTC/USD:USD-240329" }
