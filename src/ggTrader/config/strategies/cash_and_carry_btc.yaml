# Shared future-leg metadata (applies to every entry above)
futures_defaults:
  asset_class: crypto_dated_future
  venue: kraken_futures
  base_currency: BTC
  quote_currency: USD
  tick_size: "0.5"
  min_order_size: "0.0001"
  maker_fee_bps: "2"
  taker_fee_bps: "5"
  calendar_id: crypto_24_7

# Entry threshold: enter when basis_apr > threshold_apr + round_trip_fee_apr.
# round_trip_fee_apr is *derived* in Phase 3.5 from instrument taker_fee_bps
# (see strategies.carry.cash_and_carry.estimate_round_trip_fee_apr). Leave it
# unset to use the derived value; override here if you have a non-default
# trading style (e.g. all-maker, OTC quotes).
threshold_apr: "0.10"          # 10% annualized basis required to enter
notional_usd: "10000"          # fixed-notional sizing per leg
roll_buffer_hours: 24

# Backtest defaults (used by ``ggt backtest cash_and_carry_btc``)
backtest:
  start: "2022-01-01"
  end: "2025-01-01"
  synthetic_seed: 42
