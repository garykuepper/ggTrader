services:
  # --- Managed Externally (Separate Installation) ---
  # ggtrader_db:
  #   image: timescale/timescaledb:latest-pg16
  #   container_name: ggtrader_db
  #   ...

  ggtrader_live:
    build: .
    container_name: ggtrader_live
    env_file: .env # Loads KRAKEN_KEY, KRAKEN_SECRET
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # Use host.docker.internal to reach the external DB on Windows/Mac host
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=ggtrader
      - DRY_RUN=true
      - TZ=America/Los_Angeles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -u ggt.py trade --dry-run

volumes:
  ggtrader_pgdata: # Dedicated persistent volume for ggTrader data
