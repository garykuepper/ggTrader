services:
  # --- Managed Externally (Separate Installation) ---
  # ggtrader_db:
  #   image: timescale/timescaledb:latest-pg16
  #   container_name: ggtrader_db
  #   ...

  ggtrader_live:
    build: .
    container_name: ggtrader_live
    env_file: .env # Loads KRAKEN_KEY, KRAKEN_SECRET
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # Use host.docker.internal to reach the external DB on Windows/Mac host
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=ggtrader
      # --- Automated Trading Settings ---
      - SYMBOLS=BTC-USD,ETH-USD,SOL-USD,DOT-USD,LINK-USD
      - TRADING_INTERVAL=4h
      - START_CASH=1000.0
      - CAPITAL_PER_TRADE=25.0
      - REOPTIMIZE_DAYS=30
      - TRAINING_YEARS=3
      - DRY_RUN=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python ggt.py trade

volumes:
  ggtrader_pgdata: # Dedicated persistent volume for ggTrader data
