services:
  # --- Managed Externally (Separate Installation) ---
  # ggtrader_db:
  #   image: timescale/timescaledb:latest-pg16
  #   container_name: ggtrader_db
  #   ...

  ggtrader_live:
    image: ghcr.io/garykuepper/ggtrader:latest
    build: .  # fallback: docker compose build
    container_name: ggtrader_live
    restart: unless-stopped
    env_file: .env # Loads KRAKEN_KEY, KRAKEN_SECRET
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/Los_Angeles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 16G
    stop_grace_period: 10s
    command: python -u ggt.py trade --adaptive-sizing --min-trailing-stop-pct 4 --min-atr-trailing-pct 4

volumes:
  ggtrader_pgdata: # Dedicated persistent volume for ggTrader data
