services:
  ggtrader_live:
    image: ghcr.io/garykuepper/ggtrader:latest
    build: .
    container_name: ggtrader_live
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/Los_Angeles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 16G
    stop_grace_period: 10s
    # Container stays up for one-shot paper trading runs via:
    #   docker compose run --rm ggtrader_live python -u ggt.py paper
    command: sleep infinity

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: ggtrader_grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ggtrader_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ggtrader_pgdata:
  ggtrader_grafana_data:
