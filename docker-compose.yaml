services:
  ggtrader_live:
    image: ghcr.io/garykuepper/ggtrader:latest
    build: .
    container_name: ggtrader_live
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./results:/app/results
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - TZ=America/Los_Angeles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 16G
    stop_grace_period: 10s
    # Container stays up for one-shot paper trading runs via:
    #   docker compose run --rm ggtrader_live python -u ggt.py paper
    command: sleep infinity

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: ggtrader_grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Consumed by grafana/provisioning/datasources/datasources.yaml so the
      # DB credential is not committed. Falls back to the local dev default.
      - GGTRADER_DB_USER=${GGTRADER_DB_USER:-ggtrader}
      - GGTRADER_DB_PASSWORD=${GGTRADER_DB_PASSWORD:-ggtrader}
    volumes:
      - ggtrader_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  # NB: no postgres volume here -- the database is the separately-managed
  # ggtrader_db container, reached via host.docker.internal:5433.
  ggtrader_grafana_data:
